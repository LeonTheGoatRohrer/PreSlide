name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-lock.txt ruff
      - name: Lint (errors only)
        run: ruff check preslide scripts tests
      - name: Tests without local data
        run: python -m pytest -q -m "not local_data" -rs
      - name: Reports parse as JSON
        run: python scripts/check_json_reports.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
